name: Build & Test

on:
  push:
    branches: [main]
    paths:
      - '**/*.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'Dockerfile.prod'
      - 'scripts/**'
      - 'models/**'
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
      - run: go test ./... -v -count=1 -race

  build:
    name: Build binary
    runs-on: ubuntu-24.04
    needs: test
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version: '1.22'
      - run: CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' -o confidential-ai ./cmd/server/
      - uses: actions/upload-artifact@v7
        with:
          name: confidential-ai
          path: confidential-ai

  docker:
    name: Build Docker image
    runs-on: ubuntu-24.04
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache
          sudo apt-get clean
          docker system prune -af
          df -h /
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: repo
        run: echo "name=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Read privasys.json
        id: manifest
        run: |
          if [ -f privasys.json ]; then
            # Base64-encode the compact JSON. Raw JSON in the label value is
            # NOT safe: docker/build-push-action parses `labels` values
            # CSV-style, so any fully-quoted token between commas — e.g. the
            # middle element of "required":["model","query","documents"] —
            # loses its quotes and the label lands as invalid JSON (broke
            # MCP-manifest detection for every v0.4.x image, 2026-07-16).
            # The management-service accepts base64-encoded JSON natively.
            echo "json=$(jq -c . privasys.json | base64 -w0)" >> "$GITHUB_OUTPUT"
          fi
      # A BuildKit registry cache next to the image. Without one, every run
      # rebuilt the ~6 GB vLLM layer, which came out with a new digest and was
      # uploaded again: the push alone took 705 s of a 20-minute job
      # (2026-11-22). With it, a commit that only touches the Go proxy, a
      # patch or a script reuses the heavy layers byte for byte, GHCR already
      # holds their blobs, and only the changed layers upload. mode=max also
      # caches the Go builder stage. The cache lives under its own tag in the
      # same package, so its blobs are the image's blobs (no second copy).
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.prod
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.name }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.name }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo.outputs.name }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
          # buildx attaches a provenance attestation by default, which turns the
          # tag into an OCI index. The platform pins and deploys one image
          # manifest (OID 4.2 is its digest), so publish a plain manifest.
          provenance: false
          sbom: false
          build-args: |
            COMMIT_SHA=${{ github.sha }}
          labels: |
            org.privasys.manifest=${{ steps.manifest.outputs.json }}
