name: vLLM batch-invariance test image

# The night-test harness for the GDN batch-invariance patch
# (tools/vllm-bi-test). Built on demand or when the harness changes; never
# deployed as a product.
on:
  push:
    branches: [main]
    paths:
      - 'tools/vllm-bi-test/**'
      - '.github/workflows/vllm-bi-test.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: vllm-bi-test
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost /usr/share/swift /opt/hostedtoolcache
          sudo apt-get clean
          docker system prune -af
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Branch heads
        id: heads
        # Build args, so a moved branch invalidates the clone layer (an ADD of
        # the GitHub API gets rate-limited on shared runners).
        run: |
          echo "bi=$(git ls-remote https://github.com/Privasys/vllm.git refs/heads/gdn-batch-invariance | cut -f1)" >> "$GITHUB_OUTPUT"
          echo "kv=$(git ls-remote https://github.com/Privasys/vllm.git refs/heads/cpu-kv-offload-cc | cut -f1)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: tools/vllm-bi-test
          push: true
          tags: ghcr.io/privasys/vllm-bi-test:latest
          build-args: |
            BI_HEAD=${{ steps.heads.outputs.bi }}
            KV_HEAD=${{ steps.heads.outputs.kv }}
          provenance: false
          sbom: false
          cache-from: type=registry,ref=ghcr.io/privasys/vllm-bi-test:buildcache
          cache-to: type=registry,ref=ghcr.io/privasys/vllm-bi-test:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
